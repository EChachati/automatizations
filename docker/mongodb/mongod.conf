# Configuración de MongoDB optimizada para limitaciones de recursos
storage:
  dbPath: /data/db
  journal:
    enabled: false
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.1
      journalCompressor: snappy
      directoryForIndexes: false
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 0.0.0.0

processManagement:
  fork: false
  pidFilePath: /var/run/mongodb/mongod.pid

security:
  authorization: enabled
