# Configuración básica de Redis
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Persistencia
save 900 1
save 300 10
save 60 10000

# AOF (Append Only File)
appendonly yes
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Seguridad
# Sin contraseña configurada

# Configuración de memoria
maxmemory-policy allkeys-lru

# Configuración de red
tcp-backlog 511
